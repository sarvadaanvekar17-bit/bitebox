server:
  port: 8081

spring:
  application:
    name: bitebox-backend
  datasource:
    url: jdbc:mysql://localhost:3306/bitebox?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    # Local dev default — override with DB_PASSWORD env var in production.
    # Never commit real credentials.
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

bitebox:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-a-long-random-string}
    expiration-ms: 86400000   # 24h access token
  pricing:
    delivery-charge: 40
    packaging-charge: 20
    currency: INR
  cors:
    # Comma-separated allowed origins (dev defaults; override via CORS_ORIGINS env)
    allowed-origins: ${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,null}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.bitebox: INFO
