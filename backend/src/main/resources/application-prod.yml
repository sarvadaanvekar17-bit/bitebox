spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # Production: credentials MUST come from environment — no defaults.
    url: ${DB_URL:jdbc:mysql://localhost:3306/bitebox?useSSL=true&serverTimezone=UTC}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Never auto-migrate schema in production without review.
      ddl-auto: validate

bitebox:
  jwt:
    # REQUIRED in production — app will fail to start without it.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # Comma-separated production origins, e.g. https://bitebox.app,https://www.bitebox.app
    allowed-origins: ${CORS_ORIGINS:https://bitebox.app}

logging:
  level:
    root: WARN
    com.bitebox: INFO
